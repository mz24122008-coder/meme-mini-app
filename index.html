
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Мемов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f0f0; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 10px; border: none; background-color: #2481cc; color: white; margin-top: 20px; }
        #meme-image { max-width: 100%; height: auto; margin-top: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>Генератор Мемов</h1>
    <p>Нажми кнопку, чтобы получить случайный мем!</p>
    <button id="generate-btn">Сгенерировать мем</button>
    <div id="meme-container"></div>

    <script>
        const generateBtn = document.getElementById('generate-btn');
        const memeContainer = document.getElementById('meme-container');
        const tg = window.Telegram.WebApp;

        generateBtn.addEventListener('click', () => {
            // Простой способ: используем сервис для генерации случайных мемов
            // В реальном приложении лучше использовать API с шаблонами
            const randomId = Math.floor(Math.random() * 1000);
            const memeUrl = `https://api.memegen.link/images/buzz/${randomId}.png`;
            
            memeContainer.innerHTML = `<img id="meme-image" src="${memeUrl}" alt="Случайный мем">`;
            
            // Даем Telegram знать, что приложение готово
            tg.ready();
        });

        // Сообщаем Telegram, что приложение загружено
        tg.ready();
        tg.expand(); // Разворачиваем на весь экран
    </script>
</body>
</html>
